.blog-wrap{

#bk{

#bk img{

#bk a{

#bk a:hover{

.blog-back{

.blog-side{

.blog-side .content{

#news-box{

}

.cal-table{
width: 100%;
border-collapse: collapse;

color: #333333;
margin: 4px 0 2px 0;
}

.cal-table caption{
font-weight: bold;
font-size: 11px;
padding-bottom: 4px;
color: #222222;
}

.cal-nav{
color: #0000EE;
text-decoration: underline;
font-weight: bold;
padding: 0 4px;
}

.cal-nav:hover{
color: #551A8B;
}

.cal-dim{
color: #888888;
padding: 0 4px;
font-weight: bold;
}

.cal-table th{
text-align: center;
font-weight: bold;
padding: 2px 0;
border-bottom: 1px solid #cccccc;
color: #333333;
}

.cal-table td{
text-align: center;
padding: 2px 0;
color: #333333;
}

.cal-post{
font-weight: bold;
text-decoration: underline;
color: #000000;
}

#rss-btn{
display: block;
position: absolute;
bottom: 15px;
right: 0;
width: 236px;
text-align: right;
box-sizing: border-box;
padding-right: 15px;
z-index: 100;
}

#rss-btn img{
width: 36px;
height: 14px;
border: 1px solid #000000;
display: inline-block;
image-rendering: pixelated;
vertical-align: bottom;
}

@media (max-width: 820px) {

.blog-wrap{
flex-direction: column;
padding-bottom: 10px;
}

.blog-main{
width: 100%;
}

.blog-side{
width: 100%;
}

#rss-btn{
position: static;
width: 100%;
text-align: right;
padding-top: 6px;
}
